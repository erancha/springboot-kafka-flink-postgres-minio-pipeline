name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scope is unit tests only: backend and Flink `mvn test`. Flink Testcontainers
# integration tests (`mvn verify`) and the frontend Vitest suite are out of scope here.
jobs:
  unit-tests:
    name: ${{ matrix.module }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, flink]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -pl <module> -am builds the shared contract-eventtype module from source first; the consumer
      # modules depend on it and it is not published to a remote repository.
      - name: Run unit tests
        run: mvn -B -f pom.xml -pl ${{ matrix.module }} -am clean test
