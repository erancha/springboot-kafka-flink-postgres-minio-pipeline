server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Restrict the actuator surface to liveness and the metrics scrape endpoint.
        include: health,prometheus
  metrics:
    distribution:
      # Export HTTP timings as cumulative latency buckets, e.g. {le=0.1s: 900, le=0.25s: 980,
      # total: 1000}. Prometheus then derives any percentile at query time — p95 = the 950th
      # request, which lands in the 0.1–0.25s bucket — instead of percentiles being pre-chosen here.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.webcharm: ${LOG_LEVEL:INFO}
    # ERROR hides the NOT_LEADER_OR_FOLLOWER WARN storm (self-healing leader-move retries); real failures still log.
    org.apache.kafka.clients.producer.internals.Sender: ${KAFKA_SENDER_LOG_LEVEL:ERROR}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  kafka:
    bootstrap-servers: ${KAFKA_HOST_LOCAL:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    topic: ${KAFKA_TOPIC:events}
    send-timeout-seconds: ${KAFKA_SEND_TIMEOUT_SECONDS:10}

minio:
  endpoint: http://${MINIO_HOST_LOCAL:localhost}:${MINIO_PORT:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket: ${MINIO_BUCKET:images}
  connect-timeout-secs: ${MINIO_CONNECT_TIMEOUT_SECS:5}
  write-timeout-secs: ${MINIO_WRITE_TIMEOUT_SECS:30}
  read-timeout-secs: ${MINIO_READ_TIMEOUT_SECS:30}
