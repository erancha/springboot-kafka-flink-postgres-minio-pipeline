# Broker logging for the apache/kafka image. The KafkaDockerWrapper merges this over the
# image default (root INFO) when mounted at /mnt/shared/config/log4j.properties. Routes
# WARN-and-above to stdout only, so `docker logs` surfaces problems without INFO chatter.
log4j.rootLogger=WARN, stdout

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
