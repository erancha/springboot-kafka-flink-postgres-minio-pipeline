# Verbatim copy of the stock apache/flink:2.2 /opt/flink/conf/log4j-console.properties, with one
# addition: a RegexFilter on org.apache.flink.metrics.MetricGroup that drops the per-checkpoint
# "Name collision ... 'pendingCommittables'" warning. That warning is a Flink framework bug
# (FLINK-35321 / FLINK-37559, both unresolved): CommitterOperator#snapshotState re-registers the
# pendingCommittables gauge on every commit, so any sink with a committer logs it every checkpoint.
# The gauge's first registration still reports to Prometheus, so the metric is intact — only the
# duplicate-registration log line is noise. The filter denies that exact message and nothing else,
# so genuine metric-name collisions (any other metric) still surface.
# Pinned to the 2.2 image default; re-sync this file if the base image's stock config changes.

# Allows this configuration to be modified at runtime. The file will be checked every 30 seconds.
monitorInterval=30

# This affects logging for both user code and Flink
rootLogger.level = ${env:ROOT_LOG_LEVEL:-INFO}
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

# Uncomment this if you want to _only_ change Flink's logging
#logger.flink.name = org.apache.flink
#logger.flink.level = INFO

# Common libraries/connectors carry an explicit level that the root logger does not override.
# The stock image pins these to INFO (e.g. Kafka client "Discovered group coordinator" chatter at
# startup); held at WARN here so only warnings and errors surface from them.
logger.pekko.name = org.apache.pekko
logger.pekko.level = WARN
logger.kafka.name= org.apache.kafka
logger.kafka.level = WARN
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN
logger.shaded_zookeeper.name = org.apache.flink.shaded.zookeeper3
logger.shaded_zookeeper.level = WARN

# Drop only the framework's per-checkpoint pendingCommittables re-registration warning; any other
# MetricGroup message (including real collisions) passes through unchanged.
logger.metricgroup.name = org.apache.flink.metrics.MetricGroup
logger.metricgroup.level = WARN
logger.metricgroup.filter.committables.type = RegexFilter
logger.metricgroup.filter.committables.regex = .*Name collision.*pendingCommittables.*
logger.metricgroup.filter.committables.onMatch = DENY
logger.metricgroup.filter.committables.onMismatch = NEUTRAL

# Log all infos to the console
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = ${sys:console.log.level:-ALL}

# Log all infos in the given rolling file
appender.rolling.name = RollingFileAppender
appender.rolling.type = RollingFile
appender.rolling.append = true
appender.rolling.fileName = ${sys:log.file}
appender.rolling.filePattern = ${sys:log.file}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=100MB
appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = ${env:MAX_LOG_FILE_NUMBER:-10}

# Suppress the irrelevant (wrong) warnings from the Netty channel handler
logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = OFF
