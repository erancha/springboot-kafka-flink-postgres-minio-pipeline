apiVersion: 1

# Flink-health alert rules (v1): liveness + stability. Each rule pairs an instant Prometheus
# query (datasource prometheus-pipeline) with a threshold expression that produces the firing
# condition. Metric names are verified against the Flink 2.2 prometheus reporter on :9249.
# Checkpoint-failure and consumer-lag/backpressure rules are deferred to a v2 pass.
groups:
  - orgId: 1
    name: flink-health
    folder: Flink Health
    interval: 1m
    rules:
      # Either Flink process (JobManager or TaskManager) unreachable to Prometheus. On this
      # single-JM/single-TM stack any one process loss stalls the pipeline. No-data (Prometheus
      # itself unreachable) is treated as firing rather than silently masked.
      - uid: flink-target-down
        title: Flink target down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Flink scrape target {{ $labels.instance }} is unreachable
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: up{job="flink"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # JobManager alive but no job in RUNNING state (job failed/cancelled while JM stays up).
      # The JM-dead case is already covered by flink-target-down. numRunningJobs is JM-scoped, so
      # its series disappearing (JM gone) maps to no-data, also treated as firing.
      - uid: flink-job-not-running
        title: Flink job not running
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: No Flink job in RUNNING state
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: flink_jobmanager_numRunningJobs
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Job up but thrashing: restarts accumulating over a 10m window (poison record, sink outage,
      # crash-loop). numRestarts is job-scoped and vanishes if the job dies entirely, so no-data
      # here means "no running job" — owned by flink-job-not-running, not this rule (noDataState OK).
      - uid: flink-restart-looping
        title: Flink restart looping
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Flink job restarting ~{{ printf "%.0f" $values.A.Value }} times / 10m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: increase(flink_jobmanager_job_numRestarts[10m])
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
