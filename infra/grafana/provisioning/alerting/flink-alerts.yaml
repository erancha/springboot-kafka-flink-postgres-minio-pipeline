apiVersion: 1

# Pipeline-health alert rules: liveness + stability + progress. Each rule pairs an instant
# Prometheus query (datasource prometheus-pipeline) with a threshold expression that produces
# the firing condition. Flink-side metric names are verified against the Flink 2.2 prometheus
# reporter on :9249; consumer-progress metrics come from kafka-exporter (job="kafka").
# Checkpoint-failure and backpressure rules are deferred to a later pass.
groups:
  - orgId: 1
    name: flink-health
    folder: Flink Health
    interval: 1m
    rules:
      # Fires when a Flink process (the JobManager or a TaskManager) is down — losing either halts
      # the whole pipeline. Prometheus keeps the up series at 0 for a configured-but-unreachable
      # target, so a real outage trips the threshold after 'for'. noDataState and execErrState are both
      # OK so neither a cold start (no series yet) nor a transient evaluation error (Grafana's SQLite is
      # briefly locked during the provisioning burst at boot) pages on startup.
      - uid: flink-target-down
        title: Flink target down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          host_machine: $MACHINE_NAME
        annotations:
          summary: '{{ $labels.host_machine }} — Flink scrape target {{ $labels.instance }} is unreachable'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: up{job="flink"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Fires when the JobManager is up but no job is RUNNING (numRunningJobs reads 0) — it failed or
      # was cancelled. noDataState is OK so a cold start, where the metric is absent until the job
      # registers, stays quiet rather than paging; a gone JobManager makes this metric disappear but
      # is already caught by "Flink target down".
      - uid: flink-job-not-running
        title: Flink job not running
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          host_machine: $MACHINE_NAME
        annotations:
          summary: '{{ $labels.host_machine }} — No Flink job in RUNNING state'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: flink_jobmanager_numRunningJobs
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # Fires when the job keeps restarting — more than twice in 10 minutes — a sign it is crashing
      # repeatedly on something like a bad record or a failing sink. If the job dies outright the
      # metric disappears; that case belongs to "Flink job not running", so no data here stays OK.
      - uid: flink-restart-looping
        title: Flink restart looping
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          host_machine: $MACHINE_NAME
        annotations:
          summary: '{{ $labels.host_machine }} — Flink job restarting ~{{ printf "%.0f" $values.A.Value }} times / 10m'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: increase(flink_jobmanager_job_numRestarts[10m])
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

      # Fires when the job is RUNNING but its Kafka source stopped making progress — which the
      # Flink-process rules above cannot see. It looks for a backlog that is not shrinking (events
      # waiting while the committed offset stays frozen), not merely a large one, so heavy load
      # tests where the backlog spikes but keeps draining do not trip it. The lag/offset series only
      # exist once the group has consumed, so both queries coalesce to 0 (`or vector(0)`): before the
      # job registers the group — every cold start — the backlog reads 0 and the rule stays quiet,
      # instead of going NoData and firing a false "stalled" on boot.
      - uid: kafka-consumer-stalled
        title: Kafka consumer stalled
        condition: D
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          host_machine: $MACHINE_NAME
        annotations:
          summary: '{{ $labels.host_machine }} — flink-processor has a Kafka backlog that is not draining'
        data:
          # Backlog: events waiting to be processed, summed across the group's partitions.
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: A
              expr: sum(kafka_consumergroup_lag{job="kafka", consumergroup="flink-processor"}) or vector(0)
              instant: true
              range: false
          # Offsets the consumer committed in the last 10 minutes; 0 means it is not advancing.
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-pipeline
            model:
              refId: B
              expr: sum(increase(kafka_consumergroup_current_offset{job="kafka", consumergroup="flink-processor"}[10m])) or vector(0)
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: math
              expression: $A > 0 && $B == 0
          - refId: D
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: D
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
