<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 1250 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ingestion   { fill: #fff3cd; stroke: #ff9800; stroke-width: 2; }
      .broker      { fill: #e8f4f8; stroke: #0066cc; stroke-width: 2; }
      .flink-region{ fill: #f8f0ff; stroke: #9b59b6; stroke-width: 2; stroke-dasharray: 8,4; }
      .flink-inner { fill: #ecdcff; stroke: #9b59b6; stroke-width: 1.5; }
      .stream-job  { fill: #f5eeff; stroke: #9b59b6; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .sink        { fill: #f0f4f8; stroke: #2196f3; stroke-width: 2; }
      .observ      { fill: #eafaf1; stroke: #27ae60; stroke-width: 2; }
      .legend-box  { fill: #fbfbfb; stroke: #bbb; stroke-width: 1; }

      .big-title   { font-family: Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #333; }
      .box-title   { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
      .resp        { font-family: Arial, sans-serif; font-size: 10.5px; fill: #006400; }
      .cfg         { font-family: Arial, sans-serif; font-size: 9.5px; fill: #9a6700; font-style: italic; }
      .mode        { font-family: Arial, sans-serif; font-size: 9.5px; fill: #6a1b9a; font-weight: bold; }
      .step        { font-family: Arial, sans-serif; font-size: 10.5px; fill: #333; }
      .retry       { font-family: Arial, sans-serif; font-size: 9.5px; fill: #e67e22; font-weight: bold; }
      .alabel      { font-family: Arial, sans-serif; font-size: 9.5px; fill: #555; }
      .region-label{ font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #7d3c98; }
      .leg-h       { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
      .leg-t       { font-family: Arial, sans-serif; font-size: 9.5px; fill: #444; }

      .sync   { stroke: #555; stroke-width: 2; fill: none; }
      .async  { stroke: #555; stroke-width: 2; fill: none; stroke-dasharray: 7,4; }
      .observe{ stroke: #555; stroke-width: 1.6; fill: none; stroke-dasharray: 2,3; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="1250" height="600" fill="#ffffff"/>
  <text x="490" y="32" class="big-title" text-anchor="middle">Real-time Data Pipeline — Responsibilities &amp; Communication</text>

  <!-- ===================== INGESTION ROW ===================== -->
  <rect x="25" y="60" width="130" height="78" class="ingestion" rx="5"/>
  <text x="90" y="82" class="box-title" text-anchor="middle">Frontend <tspan style="font-size: 9.5px;">(React)</tspan></text>
  <text x="90" y="100" class="resp" text-anchor="middle">minimal tester</text>
  <text x="90" y="114" class="resp" text-anchor="middle">submit IMAGE / DATA</text>
  <text x="90" y="128" class="cfg" text-anchor="middle">Port · env:UI_PORT</text>

  <rect x="246" y="60" width="185" height="78" class="ingestion" rx="5"/>
  <text x="339" y="82" class="box-title" text-anchor="middle">Backend <tspan style="font-size: 9.5px;">(Java Spring Boot)</tspan></text>
  <text x="339" y="101" class="resp" text-anchor="middle">validate · publish events</text>
  <text x="339" y="115" class="resp" text-anchor="middle">upload files → MinIO</text>
  <text x="339" y="131" class="cfg" text-anchor="middle">Port · env:BACKEND_PORT</text>

  <rect x="522" y="60" width="205" height="78" class="broker" rx="5"/>
  <text x="620" y="81" class="box-title" text-anchor="middle">Kafka <tspan style="font-size: 9.5px;">[KRaft]</tspan></text>
  <text x="620" y="100" class="resp" text-anchor="middle">durable event backbone</text>
  <text x="620" y="116" class="cfg" text-anchor="middle">Port · env:KAFKA_PORT</text>
  <text x="625" y="130" class="cfg" text-anchor="middle" style="font-size: 8.5px;">topics · env:KAFKA_TOPIC + KAFKA_DLQ_TOPIC</text>

  <rect x="808" y="60" width="142" height="78" class="observ" rx="5"/>
  <text x="879" y="82" class="box-title" text-anchor="middle">Kafka UI</text>
  <text x="879" y="103" class="resp" text-anchor="middle">topics, consumer groups</text>
  <text x="879" y="126" class="cfg" text-anchor="middle">Port · env:KAFKA_UI_PORT</text>

  <!-- ===================== FLINK ROW ===================== -->
  <rect x="20" y="170" width="710" height="240" class="flink-region" rx="10"/>
  <text x="375" y="190" class="region-label" text-anchor="middle" style="font-size: 14px;">Flink Cluster <tspan class="mode">[checkpointed · event-time + watermarks]</tspan></text>

  <rect x="32" y="205" width="142" height="80" class="flink-inner" rx="5"/>
  <text x="103" y="226" class="box-title" text-anchor="middle" style="fill: #7d3c98;">JobManager</text>
  <text x="103" y="245" class="resp" text-anchor="middle">coordinate job</text>
  <text x="103" y="259" class="resp" text-anchor="middle">checkpoints · recovery</text>
  <text x="103" y="277" class="cfg" text-anchor="middle">UI disabled (compose)</text>

  <rect x="32" y="300" width="142" height="80" class="flink-inner" rx="5"/>
  <text x="103" y="321" class="box-title" text-anchor="middle" style="fill: #7d3c98;">TaskManager</text>
  <text x="103" y="340" class="resp" text-anchor="middle">execute operators</text>
  <text x="103" y="354" class="resp" text-anchor="middle">slots = parallelism</text>
  <text x="103" y="372" class="cfg" text-anchor="middle" style="font-size: 8.5px;">slots · compose:numTaskSlots</text>

  <rect x="266" y="200" width="452" height="190" class="stream-job" rx="5"/>
  <text x="492" y="221" class="region-label" text-anchor="middle" style="font-size: 12px;">StreamingJob</text>
  <text x="281" y="244" class="step">① consume → parse JSON → assign event-time watermarks</text>
  <text x="281" y="265" class="step">② DATA → write to Postgres   <tspan class="retry">[sync JDBC · ↻ on transient]</tspan></text>
  <text x="281" y="286" class="step">③ IMAGE → always to MinIO (URL: fetch + clone) → write key to Postgres</text>
  <text x="299" y="299" class="retry">[async I/O · ↻ on transient]</text>
  <text x="281" y="320" class="step">④ all events → key by type → tumbling window → per-type counts</text>
  <text x="281" y="341" class="step">⑤ image sizes → bucket → tumbling window → size histogram</text>
  <text x="281" y="362" class="step">⑥ any-stage failure → dead-letter to Kafka</text>
  <text x="299" y="375" class="retry" style="fill: #c0392b;">[events-dlq · at-least-once]</text>

  <!-- Prometheus (observability, right of Flink) -->
  <rect x="778" y="210" width="166" height="90" class="observ" rx="5"/>
  <text x="861" y="234" class="box-title" text-anchor="middle">Prometheus</text>
  <text x="861" y="256" class="resp" text-anchor="middle">scrape pipeline</text>
  <text x="861" y="270" class="resp" text-anchor="middle">metrics</text>
  <text x="861" y="290" class="cfg" text-anchor="middle">Port · env:PROMETHEUS_PORT</text>

  <!-- ===================== STORAGE / ANALYTICS ROW ===================== -->
  <rect x="32" y="430" width="180" height="115" class="sink" rx="5"/>
  <text x="122" y="453" class="box-title" text-anchor="middle">MinIO <tspan class="mode">[S3]</tspan></text>
  <text x="122" y="475" class="resp" text-anchor="middle">store image objects</text>
  <text x="122" y="490" class="resp" text-anchor="middle">(all - uploaded and URLs)</text>
  <text x="122" y="508" class="cfg" text-anchor="middle">ports · env:MINIO_*_EXPOSED</text>
  <text x="122" y="528" class="step" text-anchor="middle">bucket · env:MINIO_BUCKET</text>
  <text x="122" y="540" class="step" text-anchor="middle">layout: {date}/{uuid}.ext</text>

  <rect x="250" y="430" width="255" height="115" class="sink" rx="5"/>
  <text x="377" y="451" class="box-title" text-anchor="middle">PostgreSQL</text>
  <text x="377" y="471" class="resp" text-anchor="middle">analytics warehouse (simulation)</text>
  <text x="377" y="486" class="resp" text-anchor="middle">processed events + windowed aggregates</text>
  <text x="377" y="505" class="cfg" text-anchor="middle" style="font-size: 9px;">Port · env:POSTGRES_PORT · db env:POSTGRES_DB</text>
  <text x="377" y="524" class="step" text-anchor="middle" style="font-size: 9px;">tables: processed_events</text>
  <text x="377" y="537" class="step" text-anchor="middle" style="font-size: 8.5px;">event_type_counts_agg · image_size_buckets_agg</text>

  <rect x="560" y="435" width="150" height="110" class="observ" rx="5"/>
  <text x="635" y="460" class="box-title" text-anchor="middle">Grafana</text>
  <text x="635" y="483" class="resp" text-anchor="middle">dashboards &amp;</text>
  <text x="635" y="497" class="resp" text-anchor="middle">analytics</text>
  <text x="635" y="520" class="cfg" text-anchor="middle">Port · env:GRAFANA_PORT</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- React → Spring : sync -->
  <path d="M 155 99 L 243 99" class="sync" marker-end="url(#ah)"/>
  <text x="160" y="93" class="alabel">POST /api/events</text>
  <!-- Spring → Kafka : async -->
  <path d="M 431 99 L 519 99" class="async" marker-end="url(#ah)"/>
  <text x="475" y="93" class="alabel" text-anchor="middle">publish</text>
  <!-- Kafka → Kafka UI : observe -->
  <path d="M 727 99 L 805 99" class="observe" marker-end="url(#ah)"/>
  <text x="761" y="93" class="alabel" text-anchor="middle">read</text>
  <!-- Kafka → StreamingJob : async consume -->
  <path d="M 560 138 L 560 198" class="async" marker-end="url(#ah)"/>
  <text x="566" y="162" class="alabel">consume stream</text>
  <!-- StreamingJob → Kafka : dead-letter (async) -->
  <path d="M 680 200 L 658 140" class="async" marker-end="url(#ah)"/>
  <text x="670" y="162" class="alabel" style="fill: #c0392b;">dead-letter</text>
  <!-- Spring → MinIO : file upload (sync), routed around left edge -->
  <path d="M 270 138 L 270 158 L 12 158 L 12 488 L 30 488" class="sync" marker-end="url(#ah)"/>
  <text x="30" y="154" class="alabel">file upload (sync)</text>
  <!-- StreamingJob → MinIO : async I/O + retry -->
  <path d="M 300 390 L 165 428" class="async" marker-end="url(#ah)"/>
  <text x="188" y="403" class="alabel">image upload</text>
  <!-- StreamingJob → Postgres : sync JDBC + retry -->
  <path d="M 470 390 L 420 428" class="sync" marker-end="url(#ah)"/>
  <text x="465" y="405" class="alabel">rows + aggregates</text>
  <!-- Prometheus → Flink : scrape (observe) -->
  <path d="M 776 252 L 731 252" class="observe" marker-end="url(#ah)"/>
  <text x="861" y="204" class="alabel" text-anchor="middle">scrape metrics</text>
  <!-- Postgres → Grafana : query (observe) -->
  <path d="M 505 492 L 558 492" class="observe" marker-end="url(#ah)"/>
  <text x="531" y="486" class="alabel" text-anchor="middle">query</text>
  <!-- Prometheus → Grafana : query (observe) -->
  <path d="M 861 300 L 861 470 L 712 470" class="observe" marker-end="url(#ah)"/>
  <text x="770" y="464" class="alabel">query metrics</text>
  <!-- JobManager → TaskManager : control (sync) -->
  <path d="M 103 285 L 103 298" class="sync" marker-end="url(#ah)"/>
  <!-- JobManager → StreamingJob : deploy/coordinate -->
  <path d="M 174 245 L 264 245" class="sync" marker-end="url(#ah)"/>
  <text x="219" y="240" class="alabel" text-anchor="middle">deploy</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="1015" y="58" width="210" height="400" class="legend-box" rx="6"/>
  <text x="1025" y="80" class="leg-h" style="font-size: 13px;">Legend</text>

  <text x="1025" y="106" class="leg-h">Communication</text>
  <path d="M 1027 120 L 1060 120" class="sync"/>
  <text x="1068" y="124" class="leg-t">sync call (blocks for reply)</text>
  <path d="M 1027 140 L 1060 140" class="async"/>
  <text x="1068" y="144" class="leg-t">async stream (decoupled)</text>
  <path d="M 1027 160 L 1060 160" class="observe"/>
  <text x="1068" y="164" class="leg-t">observe / pull (scrape, query)</text>
  <text x="1027" y="184" class="leg-t" style="font-weight: bold; fill: #e67e22;">↻  retry with backoff</text>

  <text x="1025" y="225" class="leg-h">Notes</text>
  <text x="1027" y="242" class="leg-t">Ports &amp; secrets live in .env;</text>
  <text x="1027" y="256" class="leg-t">compose maps them. The diagram</text>
  <text x="1027" y="270" class="leg-t">names the var, not the value.</text>
  <text x="1027" y="292" class="leg-t">Flink UI is disabled by default</text>
  <text x="1027" y="306" class="leg-t">(compose port commented out).</text>
  <text x="1027" y="328" class="leg-t">Job-level restart: exponential</text>
  <text x="1027" y="342" class="leg-t">backoff (managed by Flink).</text>
  <text x="1027" y="364" class="leg-t">Offsets commit on checkpoint,</text>
  <text x="1027" y="378" class="leg-t">not on Kafka auto-commit.</text>
  <text x="1027" y="400" class="leg-t">events-dlq gathers failures from</text>
  <text x="1027" y="414" class="leg-t">every stage (parse, upload, writes).</text>
</svg>
