# Suppress the benign "MiniCluster is not yet running or has already been shut down" WARN
# that CollectResultFetcher emits during teardown when the job finishes before the iterator
# close path can query job status. The test data is already fully collected at that point.
org.slf4j.simpleLogger.log.org.apache.flink.streaming.api.operators.collect.CollectResultFetcher=ERROR
