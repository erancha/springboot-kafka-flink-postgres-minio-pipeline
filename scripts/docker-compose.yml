x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-postgres-connection: &postgres-connection
  <<: *postgres-credentials
  POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# JobManager, TaskManager, and the job submitter all run one locally-built image: stock
# apache/flink:2.2-java21 plus the streaming-job jar, with the JRE-absent jdk.compiler exports
# stripped from the default JVM opts (see flink/Dockerfile). Shared so the strip and the runtime
# stay identical across the three, and the image builds once.
x-flink-image: &flink-image
  build:
    context: ./flink
  image: pipeline-flink:local

services:
  # Kafka broker/controller (KRaft) used as the event streaming backbone for the assignment.
  kafka:
    image: apache/kafka:3.7.1
    # Memory caps below are sized for the 8GB WSL2 VM (see ~/.wslconfig): each limit sits above the
    # service runtime's default heap so it bounds runaways without triggering OOM kills. As caps
    # (not reservations) their sum may exceed 8GB; real concurrent usage stays well under it.
    deploy:
      resources:
        limits:
          memory: 1536m
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # This path must be one the Kafka image already creates: a new volume inherits the owner of
      # the directory already at its mount point, so the non-root broker can write to it. A path
      # the image does not create comes up owned by root, and the broker fails to start.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/log4j.properties:/mnt/shared/config/log4j.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_PORT} --list 1>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Kafka UI for inspecting topics/messages locally during development and demos.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${KAFKA_HOST}:${KAFKA_PORT}
      - LOGGING_LEVEL_ROOT=WARN
      # The image ships logging.level.com.provectus=DEBUG, which outranks root and emits a
      # per-poll "Metrics updated" line every 30s; pin its own packages to WARN to silence it.
      - LOGGING_LEVEL_COM_PROVECTUS=WARN
    depends_on:
      kafka:
        condition: service_healthy

  # Reads committed consumer-group offsets straight from Kafka and exposes lag as
  # kafka_consumergroup_lag for Prometheus. This is the authoritative "are we keeping up"
  # signal (latest - committed offset, matching Kafka UI), independent of Flink's health —
  # unlike Flink's pendingRecords, which reports only while the source task is RUNNING.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    deploy:
      resources:
        limits:
          memory: 128m
    command: ["--kafka.server=${KAFKA_HOST}:${KAFKA_PORT}"]
    depends_on:
      kafka:
        condition: service_healthy

  # Kafka bootstrap job to create the events and DLQ topics before producers/consumers begin exchanging events.
  # Retention is set via --alter (not only --create --config) so it is enforced on every startup, including
  # when the topic already exists on the persistent kafka_data volume. events: 4 hours; DLQ: 7 days.
  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_HOST}:${KAFKA_PORT} --create --if-not-exists --topic ${KAFKA_TOPIC} --partitions ${PIPELINE_PARALLELISM} --replication-factor 1 &&
      /opt/kafka/bin/kafka-configs.sh --bootstrap-server ${KAFKA_HOST}:${KAFKA_PORT} --alter --entity-type topics --entity-name ${KAFKA_TOPIC} --add-config retention.ms=14400000 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_HOST}:${KAFKA_PORT} --create --if-not-exists --topic ${KAFKA_DLQ_TOPIC} --partitions 1 --replication-factor 1 --config retention.ms=604800000"]

  # PostgreSQL simulating a data-warehouse-like analytics database for processed DATA/IMAGE events.
  postgres:
    image: postgres:16
    deploy:
      resources:
        limits:
          memory: 768m
    # max_connections must clear ~4 x PIPELINE_PARALLELISM (the Flink sinks' per-slot pools); see .env.
    # max_wal_size is lifted off the 1GB default: the batched event sink's WAL volume otherwise forces a
    # checkpoint every ~15s, and the near-continuous flush I/O inflates INSERT latency past the sink
    # socket timeout. wal_compression shrinks WAL to space checkpoints out further.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
      - -c
      - max_wal_size=4GB
      - -c
      - shared_buffers=192MB
      - -c
      - wal_compression=on
    environment:
      <<: *postgres-credentials
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15

  grafana:
    image: grafana/grafana-oss:11.0.0
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Grafana only reads GF_-prefixed env, so remap the project's SMTP_*/EMAIL_TO names onto it.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASS}
      - GF_SMTP_FROM_ADDRESS=${SMTP_USER}
      - EMAIL_TO=${EMAIL_TO}
      # Names the staging host in Flink alerts; injected by scripts/common.sh compose().
      - MACHINE_NAME=${MACHINE_NAME:-unknown}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Prometheus scrapes the Flink JobManager/TaskManager metrics reporter so pipeline health
  # (consumer lag, restarts, backpressure, checkpoints, DLQ volume by stage, retryable
  # enrichment failures) is queryable; Grafana reads it via the Prometheus datasource.
  prometheus:
    image: prom/prometheus:v2.54.1
    deploy:
      resources:
        limits:
          memory: 384m
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - flink-jobmanager

  # MinIO provides local S3-compatible object storage for IMAGE event outputs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    deploy:
      resources:
        limits:
          memory: 512m
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT_EXPOSED}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT_EXPOSED}:${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  # MinIO bootstrap job to create the images bucket required by the assignment pipeline; this is a one-shot init container and is expected to exit successfully.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://${MINIO_HOST}:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/${MINIO_BUCKET} && mc anonymous set download local/${MINIO_BUCKET} || true"]

  # Spring Boot API layer that validates UI requests and publishes JSON events to Kafka.
  backend:
    build:
      context: ./backend
    # CPU weight; ~50% of the 1024 default deprioritizes it when cores are saturated (no-op when free).
    # cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 1024m
    environment:
      - SERVER_PORT=8080
      - KAFKA_HOST_LOCAL=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_PORT}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - MINIO_HOST_LOCAL=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
      # SSRF allowlist for URL-based IMAGE events; an empty value denies every imageUrl fetch with 403.
      - IMAGE_URL_ALLOWED_HOSTS=${IMAGE_URL_ALLOWED_HOSTS}
      - MAX_REQUEST_CONTENT_LENGTH=${MAX_REQUEST_CONTENT_LENGTH}
      - EVENT_PAYLOAD_SCHEMA=${EVENT_PAYLOAD_SCHEMA}
      - LOG_LEVEL=${LOG_LEVEL:-}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Flink JobManager providing the stream processing control plane for the assignment.
  flink-jobmanager:
    <<: *flink-image
    command: jobmanager
    deploy:
      resources:
        limits:
          memory: 1792m
    # ports: ["8081:8081"]  # Flink UI — uncomment to expose locally
    volumes:
      - ./infra/flink/log4j-console.properties:/opt/flink/conf/log4j-console.properties:ro
    environment:
      - ROOT_LOG_LEVEL=WARN
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Flink TaskManager providing execution slots/workers for the streaming job.
  flink-taskmanager:
    <<: *flink-image
    command: taskmanager
    # CPU weight; double the 1024 default prioritizes it when cores are saturated (no-op when free).
    # cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: ${FLINK_TM_MEMORY}
    volumes:
      - ./infra/flink/log4j-console.properties:/opt/flink/conf/log4j-console.properties:ro
    environment:
      - ROOT_LOG_LEVEL=WARN
      - JDBC_BATCH_SIZE=${JDBC_BATCH_SIZE:-500}
      - JDBC_SOCKET_TIMEOUT_SECS=${JDBC_SOCKET_TIMEOUT_SECS:-20}
      - JDBC_QUERY_TIMEOUT_SECS=${JDBC_QUERY_TIMEOUT_SECS:-20}
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${PIPELINE_PARALLELISM}
        taskmanager.memory.process.size: ${FLINK_TM_MEMORY}
        taskmanager.memory.network.min: 512mb
        taskmanager.memory.network.max: 512mb
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    depends_on:
      - flink-jobmanager

  # Flink job submitter for the Kafka->(MinIO/Postgres) pipeline; unlike minio-init it is not expected to exit immediately, and an early exit means job submission/startup failed.
  flink-job:
    <<: *flink-image
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      <<: *postgres-connection
      ROOT_LOG_LEVEL: WARN
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST}:${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC}
      MINIO_ENDPOINT: http://${MINIO_HOST}:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["/bin/bash", "-lc", "until curl -fsS http://flink-jobmanager:8081/overview >/dev/null; do echo 'waiting for flink-jobmanager...'; sleep 2; done; /opt/flink/bin/flink run -m flink-jobmanager:8081 -d -p ${PIPELINE_PARALLELISM} -c com.webcharm.pipeline.StreamingJob /opt/job/app.jar && tail -f /dev/null"]

  # React UI (served via Nginx) used to submit IMAGE/DATA events to the backend API.
  ui:
    build:
      context: ./frontend
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "${UI_PORT}:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT}
      - BACKEND_HOST=backend
    depends_on:
      - backend

volumes:
  kafka_data:
  postgres_data:
  minio_data:
  grafana_data:
  prometheus_data:
